[pytest]
# Pytest configuration for Odoo Playwright tests

asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Markers
markers =
    async: marks tests as async (deselect with '-m "not async"')
    integration: marks tests as integration tests that require live Odoo
    slow: marks tests as slow
    smoke: marks tests as smoke tests (quick validation)
    fix_needed: marks test for functions with known Odoo 17 issues

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Asyncio
asyncio_default_fixture_scope = function
