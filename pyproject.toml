[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-playwright"
version = "1.0.0"
description = "Tools to interact with Odoo UI using Playwright"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Antoine", email = "antoine@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["odoo", "playwright", "testing", "ui", "e2e"]
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-playwright>=0.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
mcp = [
    "mcp>=2.0.0",
]

[project.scripts]
odoo-playwright-mcp = "odoo_playwright.mcp_server:main"

[project.urls]
Homepage = "https://github.com/antoine/odoo-playwright"
Documentation = "https://github.com/antoine/odoo-playwright#readme"
Repository = "https://github.com/antoine/odoo-playwright"
Issues = "https://github.com/antoine/odoo-playwright/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_playwright"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
